# write deployment for controller
kind: StatefulSet
apiVersion: apps/v1
metadata:
  name: vpsie-csi-controller
  namespace: kube-system
  labels:
    app.kubernetes.io/name: vpsie-csi-driver
spec: 
  serviceName: "vpsie-csi-controller"
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: vpsie-csi-driver
  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/default-container: vpsie-csi-plugin
      labels:
        app.kubernetes.io/name: vpsie-csi-driver
        role: vpsie-csi
    spec:
      priorityClassName: system-cluster-critical
      serviceAccount: vpsie-csi-controller-sa
      containers:
        - name: csi-provisioner
          image: quay.io/k8scsi/csi-provisioner:v1.6.0
          args:
            - "--csi-address=$(ADDRESS)"
            - "--v=5"
            - "--timeout=150s"
            - "--feature-gates=Topology=true"
            - "--strict-topology"
            - "--enable-leader-election"
            - "--leader-election-type=leases"
            - "--default-fstype=ext4"

          env:
            - name: ADDRESS
              value: /var/lib/csi/sockets/pluginproxy/csi.sock
          imagePullPolicy: "IfNotPresent"
          volumeMounts:
            - name: socket-dir
              mountPath: /var/lib/csi/sockets/pluginproxy
        - name: csi-attacher
          image: quay.io/k8scsi/csi-attacher:v2.2.0
          args:
            - "--v=5"
            - "--csi-address=$(ADDRESS)"
            - "--leader-election"
          env:
            - name: ADDRESS
              value: /var/lib/csi/sockets/pluginproxy/csi.sock
          imagePullPolicy: "IfNotPresent"
          volumeMounts:
            - name: socket-dir
              mountPath: /var/lib/csi/sockets/pluginproxy/
        - name: csi-resizer
          image: quay.io/k8scsi/csi-resizer:v0.5.0
          args:
            - "--v=5"
            - "--csi-address=$(ADDRESS)"
            - "--leader-election"
            - "--handle-volume-inuse-error=false"
            - "--timeout=150s"
          env:
            - name: ADDRESS
              value: /var/lib/csi/sockets/pluginproxy/csi.sock
              value: /var/lib/csi/sockets/pluginproxy/csi.sock
          imagePullPolicy: "IfNotPresent"
          volumeMounts:
            - name: socket-dir
              mountPath: /var/lib/csi/sockets/pluginproxy/
        - name: csi-vpsie-plugin
          image: vpsie/csi-vpsie:latest
          args:
            - "--endpoint=$(CSI_ENDPOINT)"
            - "--vpsieid=$(VPSIEID)"
            - "--datacenter=$(DATACENTER)"
            - "--clientid=$(CLIENTID)"
            - "--clientsecret=$(CLIENTSECRET)"
            - "--url=$(URL)"
            - "--controller"
          env:
            - name: CSI_ENDPOINT
              value: unix:///var/lib/csi/sockets/pluginproxy/csi.sock
            - name: VPSIEID
              valueFrom:
                secretKeyRef:
                  name: vpsie-secret
                  key: vpsieid
            - name: DATACENTER
              valueFrom:
                secretKeyRef:
                  name: vpsie-secret
                  key: datacenter
            - name: CLIENTID
              valueFrom:
                secretKeyRef:
                  name: vpsie-secret
                  key: clientid
            - name: CLIENTSECRET
              valueFrom:
                secretKeyRef:
                  name: vpsie-secret
                  key: clientsecret
            - name: URL
              valueFrom:
                secretKeyRef:
                  name: vpsie-secret
                  key: url
          imagePullPolicy: "IfNotPresent"
          volumeMounts:
            - name: socket-dir
              mountPath: /var/lib/csi/sockets/pluginproxy/
      volumes:
        - name: socket-dir
          emptyDir: {}

---
kind: ServiceAccount
apiVersion: v1
metadata:
  name: vpsie-csi-controller-sa
  namespace: kube-system