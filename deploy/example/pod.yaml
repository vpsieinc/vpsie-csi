apiVersion: v1
kind: Pod
metadata:
  name: csi-pod
spec:
  containers:
    - name: csi-pod
      image: busybox
      command: [ "sleep", "1000000" ]
      volumeMounts:
        - name: csi-vol
          mountPath: /data
  volumes:
    - name: csi-vol
      persistentVolumeClaim:
        claimName: csi-pvc