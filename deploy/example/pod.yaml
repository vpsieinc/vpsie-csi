apiVersion: v1
kind: Pod
metadata:
  name: csi-pod
spec:
  containers:
    - name: csi-pod
      image: busybox
      volumeMounts:
        - mountPath: "/data"
          name: csi-vol
      command: [ "sleep", "1000000" ]
  volumes:
    - name: csi-vol
      persistentVolumeClaim:
        claimName: csi-pvc